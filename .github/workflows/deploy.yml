name: Desplegar Web (Automático)

on:
  # 1. Se ejecuta al subir código nuevo a GitHub
  push:
    branches:
      - main
      - master
  
  # 2. Se ejecuta cuando Sanity envía la señal de "Post Publicado"
  repository_dispatch:
    types: [sanity-publish]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Descargar código
      uses: actions/checkout@v4
    
    - name: 🏗 Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        
    - name: 📦 Instalar dependencias
      run: npm install
      
    - name: 🔨 Construir Web y generar Sitemap
      env:
        VITE_SANITY_PROJECT_ID: ${{ secrets.VITE_SANITY_PROJECT_ID }}
      run: npm run build
      
    - name: 📂 Subir a cPanel por FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: /public_html/
